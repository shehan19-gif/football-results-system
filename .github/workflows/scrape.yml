name: Daily Football Scraper

on:
  schedule:
    # Runs daily at 5:00 AM Sri Lanka time (23:30 UTC)
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          LINK: ${{ secrets.LINK }}
        run: node scraper/index.js
